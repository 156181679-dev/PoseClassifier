<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UbiQigongSmart · Gemma 4 Good</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f4f2ec;
            --ink: #2a2927;
            --muted: rgba(42, 41, 39, 0.58);
            --faint: rgba(42, 41, 39, 0.16);
            --serif: "Noto Serif SC", "Songti SC", serif;
            --english: "Cormorant Garamond", Georgia, serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--serif);
            overflow: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.12;
            background-image:
                linear-gradient(rgba(42, 41, 39, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(42, 41, 39, 0.025) 1px, transparent 1px);
            background-size: 44px 44px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .viewport {
            position: relative;
            width: 100vw;
            min-height: 100dvh;
            display: grid;
            grid-template-rows: 18dvh 1fr 18dvh;
        }

        .paper-band {
            position: relative;
            z-index: 3;
            background: var(--paper);
        }

        .paper-band.top {
            box-shadow: 0 18px 42px rgba(244, 242, 236, 0.82);
        }

        .paper-band.bottom {
            box-shadow: 0 -18px 42px rgba(244, 242, 236, 0.9);
        }

        .canvas-area {
            position: relative;
            overflow: visible;
        }

        #webgl-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            mix-blend-mode: multiply;
            opacity: 0.92;
            overflow: hidden;
        }

        #inkCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .canvas-area::after {
            content: none;
        }

        .layer {
            position: absolute;
            inset: 0;
            z-index: 6;
            pointer-events: none;
        }

        .brand {
            position: absolute;
            left: 2.4vw;
            top: 2.8dvh;
            z-index: 4;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            color: rgba(42, 41, 39, 0.46);
        }

        .mark {
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(42, 41, 39, 0.28);
            font-family: var(--english);
            font-size: 12px;
            flex: 0 0 auto;
        }

        .brand-name {
            max-width: none;
            font-family: var(--english);
            font-size: 18px;
            line-height: 1;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .brand-sub {
            color: rgba(42, 41, 39, 0.42);
            font-size: 9px;
            letter-spacing: 0.14em;
            white-space: nowrap;
        }

        .nav {
            position: absolute;
            left: 15vw;
            top: 37%;
            display: grid;
            gap: clamp(28px, 5dvh, 54px);
            pointer-events: auto;
        }

        .nav a {
            display: grid;
            gap: 5px;
            width: fit-content;
            opacity: 0.68;
            transition: opacity 560ms cubic-bezier(0.32, 0.72, 0, 1), transform 560ms cubic-bezier(0.32, 0.72, 0, 1);
        }

        .nav a:hover {
            opacity: 1;
            transform: translateX(7px);
        }

        .nav-cn {
            position: relative;
            font-family: var(--english);
            font-size: clamp(20px, 1.7vw, 28px);
            font-style: italic;
            letter-spacing: 0.06em;
        }

        .nav-cn::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0;
            height: 1px;
            background: var(--ink);
            transition: width 560ms cubic-bezier(0.32, 0.72, 0, 1);
        }

        .nav a:hover .nav-cn::after {
            width: 72%;
        }

        .nav-en {
            color: var(--muted);
            font-family: var(--serif);
            font-size: 13px;
            font-style: normal;
            letter-spacing: 0.24em;
        }

        .title {
            position: absolute;
            right: 10vw;
            top: -3.8dvh;
            z-index: 8;
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: clamp(42px, 4.2vw, 72px);
            font-weight: 300;
            letter-spacing: 0.34em;
            line-height: 1.72;
            text-shadow: 0 0 22px rgba(244, 242, 236, 0.82);
        }

        .poem {
            position: absolute;
            left: 55vw;
            top: 16%;
            writing-mode: vertical-rl;
            color: var(--muted);
            font-size: clamp(13px, 1vw, 16px);
            letter-spacing: 0.45em;
            line-height: 2.35;
            opacity: 0.76;
        }

        .identity {
            position: absolute;
            right: 26vw;
            bottom: 22%;
            pointer-events: auto;
        }

        .identity-main {
            font-family: var(--english);
            font-size: clamp(28px, 2.4vw, 42px);
            line-height: 1;
            letter-spacing: 0.02em;
        }

        .identity-sub {
            margin-top: 10px;
            color: var(--ink);
            font-size: clamp(16px, 1.25vw, 22px);
            letter-spacing: 0.35em;
        }

        .identity-role {
            margin-top: 14px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.2em;
        }

        .footer {
            position: absolute;
            left: 8vw;
            bottom: 7dvh;
            z-index: 4;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.22em;
        }

        .enter {
            position: absolute;
            right: 8vw;
            bottom: 6.5dvh;
            z-index: 4;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--faint);
            color: var(--muted);
            font-family: var(--english);
            font-size: 17px;
            font-style: italic;
            letter-spacing: 0.08em;
            pointer-events: auto;
            transition: color 420ms cubic-bezier(0.32, 0.72, 0, 1), transform 420ms cubic-bezier(0.32, 0.72, 0, 1);
        }

        .enter:hover {
            color: var(--ink);
            transform: translateX(4px);
        }

        @media (max-width: 900px) {
            .viewport {
                grid-template-rows: 13dvh 1fr 15dvh;
            }

            .brand {
                left: 4vw;
                top: 2.6dvh;
            }

            .brand-name {
                max-width: none;
                font-size: 17px;
            }

            .nav {
                left: 6vw;
                top: 30%;
                gap: 28px;
            }

            .title {
                right: 6vw;
                top: -2dvh;
                font-size: 42px;
                letter-spacing: 0.22em;
            }

            .poem {
                display: none;
            }

            .identity {
                right: 8vw;
                bottom: 16%;
            }
        }

        @media (max-width: 620px) {
            .viewport {
                grid-template-rows: 12dvh 1fr 14dvh;
            }

            .brand-name {
                font-size: 16px;
            }

            .brand-sub {
                font-size: 11px;
            }

            .nav {
                top: 32%;
                gap: 24px;
            }

            .nav-cn {
                font-size: 17px;
                letter-spacing: 0.18em;
            }

            .title {
                right: 4vw;
                top: -1dvh;
                font-size: 32px;
                line-height: 1.6;
                opacity: 0.9;
            }

            .identity {
                left: 44vw;
                right: 5vw;
                bottom: 18%;
            }

            .identity-main {
                font-size: 24px;
            }

            .footer {
                left: 6vw;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <main class="viewport">
        <div class="paper-band top"></div>

        <section class="canvas-area" aria-label="UbiQigongSmart home">
            <div id="webgl-container" aria-hidden="true"></div>

            <div class="layer">
                <nav class="nav" aria-label="Primary">
                    <a href="/practice">
                        <span class="nav-cn">Practice</span>
                        <span class="nav-en">修习苑</span>
                    </a>
                    <a href="/assessment">
                        <span class="nav-cn">Assessment</span>
                        <span class="nav-en">评鉴室</span>
                    </a>
                    <a href="/coach">
                        <span class="nav-cn">Coach</span>
                        <span class="nav-en">教练台</span>
                    </a>
                </nav>

                <div class="poem">
                    气息入静，动作归准。<br>
                    身有所养，心有所安。
                </div>

                <h1 class="title">天地浮游<br>沧海一粟</h1>

                <div class="identity">
                    <div class="identity-main">UbiQigongSmart</div>
                    <div class="identity-sub">优必气功 · 智修</div>
                    <div class="identity-role">Gemma 4 Good Hackathon</div>
                </div>
            </div>
        </section>

        <div class="paper-band bottom"></div>

        <header class="brand">
            <div class="mark">Qi</div>
            <div>
                <div class="brand-name">Ubi Qigong Smart</div>
                <div class="brand-sub">AI wellness platform</div>
            </div>
        </header>

        <div class="footer">2026 · AI wellness practice</div>
        <a class="enter" href="/practice">Enter practice</a>
    </main>

    <script src="/static/vendor/three.min.js"></script>
    <script>
        function initInkCanvas() {
            const container = document.getElementById("webgl-container");
            if (!container || container.querySelector("canvas") || typeof THREE === "undefined") return;

            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.domElement.id = "inkCanvas";
            container.appendChild(renderer.domElement);

            const vertexShader = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }";
            const fragmentShader = `
                uniform float u_time;
                uniform vec2 u_resolution;
                varying vec2 vUv;
                vec3 permute(vec3 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
                float snoise(vec2 v){
                    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                    vec2 i = floor(v + dot(v, C.yy));
                    vec2 x0 = v - i + dot(i, C.xx);
                    vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
                    vec4 x12 = x0.xyxy + C.xxzz;
                    x12.xy -= i1;
                    i = mod(i, 289.0);
                    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
                    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                    m = m*m; m = m*m;
                    vec3 x = 2.0 * fract(p * C.www) - 1.0;
                    vec3 h = abs(x) - 0.5;
                    vec3 ox = floor(x + 0.5);
                    vec3 a0 = x - ox;
                    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
                    vec3 g;
                    g.x = a0.x * x0.x + h.x * x0.y;
                    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                    return 130.0 * dot(m, g);
                }
                float fbm(vec2 st){
                    float value = 0.0;
                    float amplitude = 0.5;
                    for(int i = 0; i < 5; i++){
                        value += amplitude * snoise(st);
                        st *= 2.0;
                        amplitude *= 0.5;
                    }
                    return value;
                }
                void main(){
                    vec2 st = gl_FragCoord.xy / u_resolution.xy;
                    st.x *= u_resolution.x / u_resolution.y;
                    float time = u_time * 0.05;
                    vec2 q = vec2(fbm(st + vec2(time)), fbm(st + vec2(1.0)));
                    vec2 r = vec2(
                        fbm(st + q + vec2(1.7, 9.2) + 0.15 * time),
                        fbm(st + q + vec2(8.3, 2.8) + 0.126 * time)
                    );
                    float f = fbm(st + r);
                    vec3 color = mix(vec3(0.82,0.80,0.77), vec3(0.64,0.68,0.67), clamp((f*f)*4.0, 0.0, 1.0));
                    color = mix(color, vec3(0.54,0.55,0.53), clamp(length(q), 0.0, 1.0));
                    color = mix(color, vec3(0.42,0.36,0.32), clamp(length(r.x), 0.0, 1.0) * 0.5);
                    color = mix(color, vec3(0.92,0.92,0.90), smoothstep(0.6, 1.0, f) * 0.8);
                    color += sin(st.y * 100.0) * 0.02;
                    gl_FragColor = vec4(color, 1.0);
                }
            `;

            const uniforms = {
                u_time: { value: 0 },
                u_resolution: { value: new THREE.Vector2(container.clientWidth, container.clientHeight) }
            };
            const material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
            const geometry = new THREE.PlaneGeometry(2, 2);
            scene.add(new THREE.Mesh(geometry, material));

            const clock = new THREE.Clock();
            let animationFrameId = 0;
            const animate = () => {
                animationFrameId = requestAnimationFrame(animate);
                uniforms.u_time.value = clock.getElapsedTime();
                renderer.render(scene, camera);
            };
            animate();

            const resize = () => {
                renderer.setSize(container.clientWidth, container.clientHeight);
                uniforms.u_resolution.value.set(container.clientWidth, container.clientHeight);
            };
            window.addEventListener("resize", resize);
            window.addEventListener("pagehide", () => {
                cancelAnimationFrame(animationFrameId);
                window.removeEventListener("resize", resize);
                geometry.dispose();
                material.dispose();
                renderer.dispose();
            }, { once: true });
        }

        document.addEventListener("DOMContentLoaded", initInkCanvas);
    </script>
    <script src="/static/ink-background.js"></script>
</body>
</html>
